services:
  app:
    image: ghcr.io/felixschndr/inverterchargecontroller
    restart: unless-stopped

    network_mode: host

    environment:
      TZ: Europe/Berlin

    volumes:
      # Mounted as a file, not passed via "environment" or "env_file": the controller re-reads it on
      # every lookup, so editing it takes effect without recreating the container.
      - ./.env:/app/.env:ro
      - ./logs:/app/logs
